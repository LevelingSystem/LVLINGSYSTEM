<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#0e1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Weekly Workout Tracker</title>
<style>
  :root{--bg:#0e1117;--card:#171b23;--line:#262c38;--txt:#e8edf5;--muted:#8b97ab;
    --accent:#4ade80;--accent2:#38bdf8;--warn:#f59e0b}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:16px}
  .wrap{max-width:860px;margin:0 auto}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
  .clock{color:var(--accent2)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  input,button{font-family:inherit;font-size:14px;border-radius:10px;border:1px solid var(--line);
    background:#0f131a;color:var(--txt);padding:9px 11px;outline:none}
  input:focus{border-color:var(--accent2)}
  button{cursor:pointer;background:var(--accent2);color:#04121c;border:none;font-weight:bold}
  button.ghost{background:#222835;color:var(--txt)}
  button.danger{background:#ef4444;color:#fff;padding:6px 10px}

  .days{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .day{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;
    transition:.15s;position:relative}
  .day:hover{border-color:var(--accent2);transform:translateY(-2px)}
  .day.today{border-color:var(--accent);box-shadow:0 0 0 1px rgba(74,222,128,.3)}
  .day .n{font-size:17px;font-weight:bold;margin-bottom:2px}
  .day .d{font-size:12px;color:var(--muted)}
  .day .p{margin-top:10px;height:6px;background:#0f131a;border-radius:99px;overflow:hidden}
  .day .p i{display:block;height:100%;background:var(--accent);width:0}
  .day .c{font-size:11px;color:var(--muted);margin-top:6px}
  .tag{font-size:10px;padding:3px 7px;border-radius:99px;background:#222835;color:var(--muted)}
  .tag.t{background:rgba(74,222,128,.15);color:var(--accent)}
  .tag.l{background:rgba(245,158,11,.13);color:var(--warn)}
  .day .tag{position:absolute;top:10px;right:10px}

  .ex{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .ex:last-child{border:none}
  .ex .nm{flex:1 1 180px;min-width:0}
  .ex .nm b{display:block;font-size:14px}
  .ex.done .nm b{text-decoration:line-through;color:var(--muted)}
  .ex .nm span{font-size:11px;color:var(--muted)}
  .sets{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .set{min-width:34px;height:30px;padding:0 8px;border-radius:9px;border:2px solid var(--line);
    background:#0f131a;color:var(--muted);font-size:12px;font-weight:bold;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:3px}
  .set.on{background:var(--accent);border-color:var(--accent);color:#04121c}
  .set.off{cursor:not-allowed;opacity:.35}
  .recbox{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px;padding:7px 9px;
    background:#0f131a;border:1px dashed var(--line);border-radius:10px}
  .recbox input{padding:5px 8px;font-size:13px;color:var(--accent);font-weight:bold}
  .reclbl{font-size:12px;color:var(--warn)}
  .unit,.recdate{font-size:11px;color:var(--muted)}
  .mini{background:#222835;color:var(--txt);font-size:11px;padding:5px 9px;border-radius:8px;font-weight:normal}
  .mini:hover{background:var(--accent);color:#04121c}
  .pr{color:var(--accent);font-size:11px}
  .empty{color:var(--muted);text-align:center;padding:22px;font-size:13px}
  .notice{padding:9px 12px;border-radius:10px;font-size:12.5px;margin-bottom:12px;
    background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);color:var(--warn)}
  .notice.ok{background:rgba(74,222,128,.1);border-color:rgba(74,222,128,.3);color:var(--accent)}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
  .stat{background:#0f131a;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
  .stat b{display:block;font-size:19px;color:var(--accent)}
  .stat span{font-size:11px;color:var(--muted)}
  .hide{display:none}

  /* ===== touch / mobile friendly ===== */
  html{-webkit-text-size-adjust:100%}
  body{padding:14px 14px calc(20px + env(safe-area-inset-bottom));
    -webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
  button,.set,.day{-webkit-user-select:none;user-select:none;touch-action:manipulation}
  button:active,.set:active{transform:scale(.95)}
  .day:active{transform:scale(.98)}
  input{font-size:16px}           /* prevents iOS zoom on focus */
  button{min-height:44px}
  .mini{min-height:36px}
  .exrow{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
  .fld{display:flex;align-items:center;gap:5px;background:#0f131a;border:1px solid var(--line);
    border-radius:10px;padding:3px 7px}
  .fld label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .fld input{border:none;background:transparent;padding:6px 2px;width:52px;text-align:center}
  .ex{align-items:stretch;flex-direction:column;gap:0}
  .ex .nm{flex:1 1 auto}
  .spacer{flex:1}

  @media(max-width:560px){
    body{padding:10px 10px calc(16px + env(safe-area-inset-bottom))}
    h1{font-size:18px}
    .sub{font-size:11.5px;line-height:1.7}
    .card{padding:12px;border-radius:13px;margin-bottom:11px}
    .days{grid-template-columns:1fr 1fr;gap:9px}
    .day{padding:12px 11px}
    .day .n{font-size:15px}
    .day .tag{position:static;display:inline-block;margin-bottom:6px}
    .day .c{font-size:10.5px}
    .stats{grid-template-columns:1fr 1fr;gap:8px}
    .stat b{font-size:17px}
    .set{min-width:44px;height:44px;font-size:14px;border-radius:11px}
    .sets{gap:8px}
    .recbox{gap:6px}
    .mini{flex:1 1 100%;text-align:center}
    #addBtn{flex:1 1 100%}
    #exName{flex:1 1 100%}
    #exCount,#exSets{flex:1}
    .topbar button{flex:1}
  }
  /* sticky quick-add bar on the day screen */
  .addcard{position:sticky;top:6px;z-index:20;backdrop-filter:blur(8px);
    background:rgba(23,27,35,.94)}

  /* ===== notes / info ===== */
  .info{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;
    border-radius:50%;border:1px solid var(--line);background:#0f131a;color:var(--accent2);
    font-size:13px;cursor:pointer;margin-inline-start:7px;vertical-align:middle;flex:none}
  .info.has{background:rgba(56,189,248,.15);border-color:var(--accent2)}
  .info:active{transform:scale(.9)}
  .nmline{display:flex;align-items:center;gap:2px}
  .nmline b{flex:0 1 auto}
  .modal{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center;
    background:rgba(0,0,0,.6);backdrop-filter:blur(3px)}
  .modal.hide{display:none}
  .sheet{background:var(--card);border:1px solid var(--line);border-bottom:none;
    border-radius:18px 18px 0 0;width:100%;max-width:560px;padding:16px;
    padding-bottom:calc(16px + env(safe-area-inset-bottom));animation:up .22s ease}
  @keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
  @media(min-width:640px){.modal{align-items:center}
    .sheet{border-radius:18px;border-bottom:1px solid var(--line)}}
  .sheet h3{margin:0 0 3px;font-size:17px}
  .sheet .who{font-size:12px;color:var(--muted);margin-bottom:12px}
  .sheet textarea{width:100%;min-height:170px;resize:vertical;background:#0f131a;color:var(--txt);
    border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:15px;
    line-height:1.7;outline:none}
  .sheet textarea:focus{border-color:var(--accent2)}
  .grab{width:42px;height:4px;background:var(--line);border-radius:9px;margin:0 auto 12px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🏋️ Weekly Workout Tracker</h1>
  <div class="sub"><span class="clock" id="clock"></span></div>

  <div id="weekView">
    <div class="days" id="days"></div>
    <div class="card" style="margin-top:14px"><div class="stats" id="stats" style="grid-template-columns:1fr 1fr"></div>
      <div id="streakHint" style="font-size:12px;color:var(--muted);text-align:center;margin-top:10px"></div></div>
    <div class="card row" style="justify-content:space-between">
      <span style="font-size:12px;color:var(--muted)">Data is saved in your browser.</span>
      <span class="row">
        <button class="ghost" id="soundBtn" data-nosfx="1">🔊 Sound: On</button>
        <button class="ghost" id="exportBtn">📤 Export</button>
        <button class="ghost" id="importBtn">📥 Import</button>
        <input type="file" id="fileIn" accept="application/json" hidden>
      </span>
    </div>
  </div>

  <div id="dayView" class="hide">
    <div class="card row topbar" style="justify-content:space-between">
      <button class="ghost" id="backBtn">‹ Back</button>
      <b id="dayTitle" style="font-size:15px"></b>
      <span id="dayTag"></span>
    </div>
    <div class="card addcard">
      <div id="lockMsg"></div>
      <div class="row">
        <input id="exName" placeholder="Exercise name (e.g. Push-ups)" style="flex:1;min-width:180px">
        <input id="exCount" type="number" inputmode="numeric" min="0" placeholder="Reps" style="width:95px">
        <input id="exSets" type="number" inputmode="numeric" min="1" value="1" placeholder="Sets" style="width:85px">
        <button id="addBtn">➕ Add</button>
      </div>
    </div>
    <div class="card">
      <div id="exList"></div>
      <div class="empty" id="empty">No exercises added for this day yet.</div>
    </div>
    <div class="card"><div class="stats" id="dayStats"></div></div>
  </div>
</div>

<div class="modal hide" id="noteModal">
  <div class="sheet" id="sheet">
    <div class="grab"></div>
    <h3 id="noteTitle">Exercise</h3>
    <div class="who">📝 Notes — technique, tips, weight, how you felt…</div>
    <textarea id="noteText" placeholder="e.g. Keep elbows at 45°, 2 min rest between sets, use 20 kg dumbbells…"></textarea>
    <div class="row" style="margin-top:12px;justify-content:space-between">
      <button class="ghost" id="noteClose">Close</button>
      <button id="noteSave">💾 Save notes</button>
    </div>
  </div>
</div>

<script>

/* ===== Sound effects (Web Audio, no files needed) ===== */
const SKEY='workout_sound';
let soundOn=localStorage.getItem(SKEY)!=='0';
let AC=null;
function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended')AC.resume();return AC;}
function beep(freq,dur=0.09,type='sine',vol=0.18,delay=0){
  if(!soundOn)return;
  try{const c=ac(),t=c.currentTime+delay,o=c.createOscillator(),g=c.createGain();
    o.type=type;o.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(vol,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+0.02);
  }catch(e){}
}
const SFX={
  click:()=>beep(520,0.06,'triangle',0.13),
  add:  ()=>{beep(660,0.08,'sine',0.16);beep(880,0.11,'sine',0.16,0.07);},
  check:()=>{beep(784,0.07,'sine',0.16);beep(1175,0.1,'sine',0.14,0.06);},
  uncheck:()=>beep(320,0.09,'sine',0.13),
  complete:()=>{[659,784,988,1319].forEach((f,i)=>beep(f,0.14,'sine',0.15,i*0.075));},
  record:()=>{[523,659,784,1047,1319].forEach((f,i)=>beep(f,0.18,'triangle',0.16,i*0.08));},
  delete:()=>{beep(300,0.1,'sawtooth',0.1);beep(180,0.16,'sawtooth',0.1,0.08);},
  error:()=>{beep(220,0.15,'square',0.09);beep(165,0.2,'square',0.09,0.12);},
  open: ()=>{beep(440,0.07,'sine',0.13);beep(660,0.09,'sine',0.12,0.05);},
  back: ()=>{beep(520,0.07,'sine',0.12);beep(390,0.09,'sine',0.12,0.05);}
};
// generic click sound on every button
document.addEventListener('pointerdown',e=>{
  const b=e.target.closest('button');
  if(b&&!b.dataset.nosfx)SFX.click();
  if((b||e.target.closest('.set,.day'))&&navigator.vibrate)navigator.vibrate(12);
},true);

const KEY='workout_program_v3';
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{plan:[[],[],[],[],[],[],[]],log:{}};
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);

/* ===== Iran time ===== */
function iranNow(){const p={};
  new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tehran',year:'numeric',month:'2-digit',day:'2-digit',
  hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false})
  .formatToParts(new Date()).forEach(x=>p[x.type]=x.value);return p;}
const todayKey=()=>{const p=iranNow();return `${p.year}-${p.month}-${p.day}`;};
const toUTC=k=>{const[a,b,c]=k.split('-').map(Number);return new Date(Date.UTC(a,b-1,c,12));};
const fmt=(k,o)=>new Intl.DateTimeFormat('en-US',Object.assign({timeZone:'UTC'},o)).format(toUTC(k));
// Persian (Jalali) calendar, Latin numerals
const jal=(k,o)=>new Intl.DateTimeFormat('en-u-ca-persian-nu-latn',Object.assign({timeZone:'UTC'},o)).format(toUTC(k));
// Saturday = 0 ... Friday = 6 (Iranian week)
const wdToday=()=>(toUTC(todayKey()).getUTCDay()+1)%7;
const NAMES=['Saturday','Sunday','Monday','Tuesday','Wednesday','Thursday','Friday'];

let current=null;
const plan=i=>db.plan[i]||(db.plan[i]=[]);
const logToday=()=>db.log[todayKey()]||(db.log[todayKey()]={});
function setsOf(id,n){
  const L=db.log[todayKey()]||{};
  let a=L[id];
  if(!Array.isArray(a)) a = a===true?Array(n).fill(true):[];
  a=a.slice(0,n); while(a.length<n)a.push(false);
  return a;
}
const doneSets=(id,n)=>setsOf(id,n).filter(Boolean).length;
function best(name){let b=0;db.plan.flat().forEach(e=>{if(e.name.trim()===name.trim())
  b=Math.max(b,+e.pr||0);});return b;}


/* ===== Streaks ===== */
const shiftKey=(k,n)=>{const d=toUTC(k);d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);};
const wdOf=k=>(toUTC(k).getUTCDay()+1)%7;
// A day counts for the streak ONLY if every set of every exercise planned for that weekday is checked.
function dayDone(k){
  const L=db.log[k]; if(!L)return false;
  const items=db.plan[wdOf(k)]||[];
  if(!items.length)return false;                 // rest day / empty plan -> not a streak day
  return items.every(e=>{
    const n=+e.sets||1, a=L[e.id];
    if(a===true)return true;
    return Array.isArray(a) && a.slice(0,n).filter(Boolean).length>=n;
  });
}
function streaks(){
  const t=todayKey();
  let cur=0, k = dayDone(t) ? t : shiftKey(t,-1);
  while(dayDone(k)){cur++;k=shiftKey(k,-1);}
  const keys=Object.keys(db.log).filter(dayDone).sort();
  let best=0,run=0,prev=null;
  keys.forEach(d=>{run = (prev && shiftKey(prev,1)===d) ? run+1 : 1; best=Math.max(best,run); prev=d;});
  return {cur,best:Math.max(best,cur)};
}

function tick(){const p=iranNow();
  clock.textContent=`⏱ ${jal(todayKey(),{weekday:'long',day:'numeric',month:'long',year:'numeric'})} — ${p.hour}:${p.minute}:${p.second} Tehran time`;
  if(tick.last&&tick.last!==todayKey()){renderWeek();if(current!==null)renderDay();}
  tick.last=todayKey();}

function renderWeek(){
  const t=wdToday();
  days.innerHTML='';
  for(let i=0;i<7;i++){
    const items=plan(i), isT=i===t;
    const totSets=items.reduce((s,e)=>s+(+e.sets||1),0);
    const done=isT?items.reduce((s,e)=>s+doneSets(e.id,+e.sets||1),0):0;
    const pct=isT&&totSets?Math.round(done/totSets*100):0;
    const el=document.createElement('div');
    el.className='day'+(isT?' today':'');
    el.innerHTML=`<span class="tag ${isT?'t':'l'}">${isT?'Today ✔':'🔒 No check'}</span>
      <div class="n">Day ${i+1}</div>
      <div class="d">${NAMES[i]}</div>
      <div class="p"><i style="width:${pct}%"></i></div>
      <div class="c">${items.length?(isT?`${done} of ${totSets} sets done (${pct}%)`:`${items.length} exercises • ${totSets} sets`):'No exercises'}</div>`;
    el.onclick=()=>openDay(i);
    days.appendChild(el);
  }
  const st=streaks();
  stats.innerHTML=`
    <div class="stat"><b>${st.cur}🔥</b><span>Current streak (days)</span></div>
    <div class="stat"><b>${st.best}🏆</b><span>Best streak (days)</span></div>`;
  const it=plan(t), ts=it.reduce((a,e)=>a+(+e.sets||1),0),
        ds=it.reduce((a,e)=>a+doneSets(e.id,+e.sets||1),0);
  streakHint.innerHTML = !it.length
    ? 'No exercises planned for today — add some to keep your streak alive.'
    : (ds>=ts ? '✅ Today is complete — streak counted!'
              : `⚡ ${ts-ds} more set${ts-ds>1?'s':''} today to extend your streak.`);
}

function openDay(i){SFX.open();current=i;weekView.classList.add('hide');dayView.classList.remove('hide');renderDay();scrollTo(0,0);}
backBtn.onclick=()=>{SFX.back();current=null;dayView.classList.add('hide');weekView.classList.remove('hide');renderWeek();};

function renderDay(){
  const i=current, isT=i===wdToday(), items=plan(i);
  dayTitle.textContent=`Day ${i+1} — ${NAMES[i]}`;
  dayTag.innerHTML=isT?'<span class="tag t">Today</span>':'<span class="tag l">🔒 Check-off disabled</span>';
  lockMsg.innerHTML=isT
    ? '<div class="notice ok">This is today ✔ you can check off your sets.</div>'
    : '<div class="notice">You can add or edit exercises here, but checking off sets is only possible on the current day (Iran time).</div>';
  exList.innerHTML='';
  empty.style.display=items.length?'none':'block';
  items.forEach((e,ix)=>{
    const ns=+e.sets||1, tot=(+e.count||0)*ns;
    const arr=setsOf(e.id,ns), dn=arr.filter(Boolean).length, full=isT&&dn===ns;
    const chips=arr.map((v,si)=>
      `<div class="set ${isT&&v?'on':''} ${isT?'':'off'}" data-ex="${ix}" data-set="${si}"
        title="Set ${si+1}">${isT&&v?'✔':''} ${si+1}</div>`).join('');
    const pr=+e.pr||0;
    const row=document.createElement('div');
    row.className='ex'+(full?' done':'');
    row.innerHTML=`<div class="nm">
      <div class="nmline"><b>${esc(e.name)}</b>
        <span class="info ${e.note?'has':''}" data-note="${ix}" title="Notes">${e.note?'📝':'ℹ️'}</span></div>
      <span>${e.count} reps × ${ns} sets = <b style="color:var(--accent2)">${tot}</b>
      ${isT?` • <b style="color:var(--accent)">${dn}/${ns} sets</b>`:''}</span>
      <div class="sets">${chips}</div>
      <div class="recbox">
        <span class="reclbl">🏅 Record:</span>
        <input type="number" inputmode="numeric" min="0" value="${pr||''}" placeholder="—" style="width:70px" data-i="${ix}" data-f="pr" title="Personal best">
        <span class="unit">reps</span>
        ${e.prDate?`<span class="recdate">📅 ${jal(e.prDate,{day:'numeric',month:'short',year:'numeric'})}</span>`:''}
        ${pr&&+e.count>=pr?'<span class="pr">🔥 New record!</span>':''}
        <button class="mini" data-pr="${ix}" title="Save today's reps as your record">Set record (${e.count})</button>
      </div>
      <div class="exrow">
        <div class="fld"><label>Reps</label><input type="number" inputmode="numeric" min="0" value="${e.count}" data-i="${ix}" data-f="count"></div>
        <div class="fld"><label>Sets</label><input type="number" inputmode="numeric" min="1" value="${ns}" data-i="${ix}" data-f="sets"></div>
        <span class="spacer"></span>
        <button class="danger" data-del="${ix}">🗑 Delete</button>
      </div></div>`;
    exList.appendChild(row);
  });
  const totSets=items.reduce((s,e)=>s+(+e.sets||1),0);
  const done=isT?items.reduce((s,e)=>s+doneSets(e.id,+e.sets||1),0):0;
  const tot=items.reduce((s,e)=>s+(+e.count||0)*(+e.sets||1),0);
  dayStats.innerHTML=`<div class="stat"><b>${items.length}</b><span>Exercises</span></div>
    <div class="stat"><b>${totSets}</b><span>Total sets</span></div>
    <div class="stat"><b>${tot}</b><span>Total reps</span></div>
    <div class="stat"><b>${isT?done:'—'}</b><span>Sets done</span></div>
    <div class="stat"><b>${isT&&totSets?Math.round(done/totSets*100)+'%':'—'}</b><span>Progress</span></div>
    <div class="stat"><b>${Math.max(0,...items.map(e=>+e.pr||0))}</b><span>Best record</span></div>`;
}

addBtn.onclick=()=>{
  const n=exName.value.trim(),c=+exCount.value,s=+exSets.value||1;
  if(!n||!c){SFX.error();alert('Please enter an exercise name and reps.');return;}
  plan(current).push({id:uid(),name:n,count:c,sets:s,pr:0,prDate:'',note:''});
  exName.value='';exCount.value='';exSets.value=1;save();renderDay();exName.focus();SFX.add();
};
exName.addEventListener('keydown',e=>{if(e.key==='Enter')exCount.focus();});
exCount.addEventListener('keydown',e=>{if(e.key==='Enter')addBtn.click();});

exList.addEventListener('click',e=>{
  const inf=e.target.closest('.info');
  if(inf){openNote(+inf.dataset.note);return;}
  const t=e.target.closest('.set'), d=e.target.dataset.del;
  if(t){
    if(current!==wdToday()){SFX.error();alert('You can only check off sets on the current day (Iran time).');return;}
    const ex=plan(current)[+t.dataset.ex], ns=+ex.sets||1, si=+t.dataset.set;
    const L=logToday(), arr=setsOf(ex.id,ns);
    arr[si]=!arr[si]; L[ex.id]=arr; save(); renderDay();
    if(arr[si]){
      const items=plan(current);
      const allDone=items.every(x=>{const n=+x.sets||1;return doneSets(x.id,n)>=n;});
      if(allDone){SFX.record();if(navigator.vibrate)navigator.vibrate([25,60,25,60,45]);
        setTimeout(()=>alert('🔥 Day complete! Streak: '+streaks().cur+' day(s)'),120);}
      else arr.every(Boolean)?SFX.complete():SFX.check();
    } else SFX.uncheck();
    renderWeek();
  } else if(e.target.dataset.pr!==undefined){
    const ex=plan(current)[+e.target.dataset.pr], c=+ex.count||0;
    if(!c){SFX.error();alert('Please enter the reps first.');return;}
    if((+ex.pr||0)>c && !confirm('Your current record is higher. Replace it?'))return;
    ex.pr=c; ex.prDate=todayKey(); save(); renderDay(); SFX.record();
    setTimeout(()=>alert('🏅 Record saved: '+c+' reps'),50);
  } else if(d!==undefined&&confirm('Remove this exercise from the plan?')){
    plan(current).splice(+d,1);save();renderDay();SFX.delete();
  }
});
exList.addEventListener('input',e=>{
  const i=e.target.dataset.i;if(i===undefined)return;
  const ex=plan(current)[i], f=e.target.dataset.f;
  ex[f]=+e.target.value;
  if(f==='pr') ex.prDate=todayKey();
  save();
});
exList.addEventListener('change',()=>renderDay());

exportBtn.onclick=()=>{const b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='workout-plan.json';a.click();};
importBtn.onclick=()=>fileIn.click();
fileIn.onchange=ev=>{const f=ev.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.plan)throw 0;db=o;save();renderWeek();}catch{alert('Invalid file');}};
  r.readAsText(f);};

soundBtn.onclick=()=>{soundOn=!soundOn;localStorage.setItem(SKEY,soundOn?'1':'0');
  soundBtn.textContent=soundOn?'🔊 Sound: On':'🔇 Sound: Off';if(soundOn)SFX.check();};
soundBtn.textContent=soundOn?'🔊 Sound: On':'🔇 Sound: Off';

/* ===== notes modal ===== */
let noteIx=null;
function openNote(ix){
  noteIx=ix;const ex=plan(current)[ix];
  noteTitle.textContent=ex.name;
  noteText.value=ex.note||'';
  noteModal.classList.remove('hide');
  SFX.open();
  setTimeout(()=>noteText.focus(),150);
}
function closeNote(){noteModal.classList.add('hide');noteIx=null;}
noteSave.onclick=()=>{
  if(noteIx===null)return;
  plan(current)[noteIx].note=noteText.value.trim();
  save();renderDay();closeNote();SFX.add();
};
noteClose.onclick=()=>{closeNote();SFX.back();};
noteModal.addEventListener('click',e=>{if(e.target===noteModal){closeNote();SFX.back();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!noteModal.classList.contains('hide'))closeNote();});

tick();setInterval(tick,1000);renderWeek();
</script>
</body>
</html>
